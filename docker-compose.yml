# OPTIONAL — only needed to see the lineage graph in the Marquez UI.
# The compliance report does NOT need this; it reads lineage/events.jsonl.
#
# Start:  docker compose up -d   (UI at http://localhost:3000, API at :5000)
# Then:   MARQUEZ_URL=http://localhost:5000 make demo
# Stop:   docker compose down -v
#
# Note: the canonical Marquez setup is the project's own ./docker/up.sh. This
# compose is a convenience; pin images to versions that work for you.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ilum/marquez:0.54.0   # maintained Marquez distribution (OpenLineage 2.0.2)
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5000:5000"   # OpenLineage HTTP API
      - "5001:5001"   # admin / healthcheck

  web:
    image: marquezproject/marquez-web:latest
    depends_on:
      - api
    environment:
      MARQUEZ_HOST: api
      MARQUEZ_PORT: 5000
    ports:
      - "3000:3000"
